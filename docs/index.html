<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel Grabber · Vídeos de partidos</title>
<meta name="description" content="Partidos de pádel grabados con Padel Grabber: resúmenes, repeticiones y partidos completos para ver y descargar.">
<script src="config.js"></script>
<style>
  :root { --navy:#0B1D33; --navy2:#132B4A; --navy3:#1D3A60; --lime:#C6FF00; --grey:#9FB3C8; --red:#FF3B30; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--navy); color:#fff; font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif; }
  a { color:var(--lime); }
  header { position:sticky; top:0; z-index:5; background:rgba(11,29,51,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--navy3); }
  .bar { max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ball { width:30px; height:30px; border-radius:50%; background:var(--lime); position:relative; flex:none; overflow:hidden; }
  .ball:before,.ball:after { content:""; position:absolute; top:4px; width:20px; height:22px; border:2px solid #fff; border-radius:50%; }
  .ball:before { left:-13px; } .ball:after { right:-13px; }
  .brand { font-weight:800; font-size:22px; letter-spacing:.5px; }
  .brand b { color:var(--lime); }
  .club { color:var(--grey); font-weight:700; }
  .search { margin-left:auto; flex:1 1 220px; max-width:360px; }
  input { font:inherit; font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid var(--navy3); background:var(--navy2); color:#fff; width:100%; }
  main { max-width:1100px; margin:0 auto; padding:18px; }
  .hero { padding:26px 0 8px; }
  .hero h1 { margin:0 0 6px; font-size:clamp(26px,5vw,42px); }
  .hero p { margin:0; color:var(--grey); font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; margin-top:20px; }
  .card { background:var(--navy2); border:1px solid var(--navy3); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { position:relative; aspect-ratio:16/9; background:#000; cursor:pointer; }
  .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .thumb .play span { width:62px; height:62px; border-radius:50%; background:var(--lime); display:flex; align-items:center; justify-content:center; color:var(--navy); font-size:26px; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  .thumb.empty { display:flex; align-items:center; justify-content:center; color:var(--grey); cursor:default; }
  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .teams { font-weight:800; font-size:20px; line-height:1.2; }
  .teams .vs { color:var(--grey); font-weight:700; font-size:15px; margin:0 6px; }
  .teams .win { color:var(--lime); }
  .res { font-size:18px; font-weight:800; letter-spacing:.5px; }
  .meta { color:var(--grey); font-size:14px; }
  .videos { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .vrow { display:flex; align-items:center; gap:8px; background:var(--navy); border-radius:10px; padding:8px 10px; }
  .vrow .name { flex:1; font-weight:700; font-size:15px; }
  .vrow .size { color:var(--grey); font-size:13px; }
  .btn { font:inherit; font-weight:800; font-size:14px; border:0; border-radius:9px; padding:8px 12px; background:var(--navy3); color:#fff; text-decoration:none; cursor:pointer; white-space:nowrap; }
  .btn.lime { background:var(--lime); color:var(--navy); }
  .empty-state { text-align:center; color:var(--grey); padding:60px 10px; }
  .setup { background:var(--navy2); border:1px solid var(--navy3); border-radius:16px; padding:20px; max-width:620px; margin:30px auto; }
  .setup h2 { margin-top:0; }
  .setup label { display:block; margin:12px 0 4px; color:var(--grey); font-weight:700; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  .modal.on { display:flex; }
  .modal video { width:min(1100px,100%); max-height:80vh; background:#000; border-radius:12px; }
  .modal .x { position:absolute; top:14px; right:16px; }
  .modal .cap { position:absolute; bottom:18px; left:0; right:0; text-align:center; color:var(--grey); }
  footer { text-align:center; color:var(--navy3); padding:40px 10px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="ball"></div>
    <div class="brand">PADEL <b>GRABBER</b></div>
    <div class="club" id="club"></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar pareja, club o pista…" autocomplete="off"></div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Partidos grabados</h1>
    <p>Resúmenes con los mejores puntos, partidos con repeticiones y todos los ángulos, listos para ver y descargar.</p>
  </section>
  <div id="app"></div>
</main>

<div class="modal" id="modal">
  <button class="btn x" onclick="closeModal()">Cerrar ✕</button>
  <video id="player" controls playsinline></video>
  <div class="cap" id="cap"></div>
</div>

<footer>Grabado con Padel Grabber</footer>

<script>
(function () {
  var cfg = window.PG_CONFIG || {};
  try {
    var saved = JSON.parse(localStorage.getItem('pg_config') || 'null');
    if (saved && saved.supabaseUrl && saved.supabaseUrl.indexOf('supabase.co') > 0 && (!cfg.supabaseUrl || !cfg.anonKey)) { cfg.supabaseUrl = saved.supabaseUrl; cfg.anonKey = saved.anonKey; cfg.bucket = saved.bucket || cfg.bucket; }
  } catch (e) {}
  cfg.bucket = cfg.bucket || 'partidos';
  var app = document.getElementById('app');
  var all = [];

  if (cfg.clubName) document.getElementById('club').textContent = '· ' + cfg.clubName;

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function base() { return String(cfg.supabaseUrl || '').replace(/\/+$/, ''); }

  function api(path) {
    return fetch(base() + '/rest/v1/' + path, {
      headers: String(cfg.anonKey).indexOf('eyJ') === 0
        ? { apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey }
        : { apikey: cfg.anonKey }
    }).then(function (r) { if (!r.ok) throw new Error('Error ' + r.status); return r.json(); });
  }

  function typeName(t) {
    if (t === 'resumen') return 'Resumen';
    if (t === 'repeticiones') return 'Partido con repeticiones';
    if (t === 'completo') return 'Partido completo';
    if (t && t.indexOf('angulo:') === 0) return 'Ángulo · ' + t.substring(7);
    return t || 'Vídeo';
  }
  function typeOrder(t) { return t === 'resumen' ? 0 : t === 'repeticiones' ? 1 : t === 'completo' ? 2 : 3; }
  function size(b) { if (!b) return ''; var mb = b / 1048576; return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB'; }
  function dateText(s) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' +
      d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  function downloadUrl(v) {
    var file = String(v.nombre || 'video.mp4').split('/').pop();
    return v.url + (v.url.indexOf('?') >= 0 ? '&' : '?') + 'download=' + encodeURIComponent(file);
  }

  function showSetup(msg) {
    app.innerHTML =
      '<div class="setup"><h2>Conecta la plataforma</h2>' +
      (msg ? '<p style="color:#FFB4A8">' + esc(msg) + '</p>' : '') +
      '<p class="meta">Pon la URL y la clave pública (<b>Publishable key</b> o la antigua <b>anon</b>) de tu proyecto de Supabase (Settings › API Keys). ' +
      'También puedes dejarlas fijas en <code>config.js</code>.</p>' +
      '<label>URL de Supabase</label><input id="su" placeholder="https://xxxx.supabase.co" value="' + esc(cfg.supabaseUrl || '') + '">' +
      '<label>Clave pública (Publishable key)</label><input id="sk" value="' + esc(cfg.anonKey || '') + '">' +
      '<label>Bucket</label><input id="sb" value="' + esc(cfg.bucket || 'partidos') + '">' +
      '<p><button class="btn lime" id="save">Guardar y cargar</button></p></div>';
    document.getElementById('save').onclick = function () {
      cfg.supabaseUrl = document.getElementById('su').value.trim();
      cfg.anonKey = document.getElementById('sk').value.trim();
      cfg.bucket = document.getElementById('sb').value.trim() || 'partidos';
      try { localStorage.setItem('pg_config', JSON.stringify(cfg)); } catch (e) {}
      load();
    };
  }

  function load() {
    if (!cfg.supabaseUrl || !cfg.anonKey) { showSetup(); return; }
    app.innerHTML = '<div class="empty-state">Cargando partidos…</div>';
    Promise.all([
      api('partidos?select=*&order=fecha.desc&limit=500'),
      api('videos?select=*&order=creado.desc&limit=3000')
    ]).then(function (res) {
      var partidos = res[0], videos = res[1];
      var byId = {};
      partidos.forEach(function (p) { p.videos = []; byId[p.id] = p; });
      videos.forEach(function (v) {
        var p = byId[v.partido_id];
        if (!p) {
          p = { id: v.partido_id, fecha: v.creado, equipo_a: 'Partido', equipo_b: v.partido_id, resultado: '', videos: [], huerfano: true };
          byId[v.partido_id] = p; partidos.push(p);
        }
        p.videos.push(v);
      });
      partidos.forEach(function (p) { p.videos.sort(function (a, b) { return typeOrder(a.tipo) - typeOrder(b.tipo); }); });
      all = partidos.filter(function (p) { return p.videos.length > 0 || !p.huerfano; });
      render();
    }).catch(function (e) {
      showSetup('No se pudieron cargar los partidos (' + e.message + '). Revisa la URL, la clave y que hayas ejecutado setup.sql.');
    });
  }

  function render() {
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = all.filter(function (p) {
      if (!q) return true;
      return [p.equipo_a, p.equipo_b, p.club, p.pista, p.resultado].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (!list.length) { app.innerHTML = '<div class="empty-state">' + (all.length ? 'Ningún partido coincide con la búsqueda.' : 'Todavía no hay partidos. Graba uno con la app y súbelo.') + '</div>'; return; }
    var html = '<div class="grid">';
    list.forEach(function (p, i) {
      var main = p.videos[0];
      var a = esc(p.equipo_a), b = esc(p.equipo_b);
      if (p.ganador === 0) a = '<span class="win">' + a + '</span>';
      if (p.ganador === 1) b = '<span class="win">' + b + '</span>';
      html += '<article class="card">';
      if (main) {
        html += '<div class="thumb" data-p="' + i + '" data-v="0"><video preload="metadata" muted src="' + esc(main.url) + '#t=4"></video>' +
          '<div class="play"><span>▶</span></div></div>';
      } else {
        html += '<div class="thumb empty">Sin vídeos todavía</div>';
      }
      html += '<div class="body"><div class="teams">' + a + '<span class="vs">vs</span>' + b + '</div>';
      if (p.resultado) html += '<div class="res">' + esc(p.resultado) + '</div>';
      var meta = [dateText(p.fecha), p.club, p.pista ? 'Pista ' + p.pista : '', p.duracion_s ? Math.round(p.duracion_s / 60) + ' min' : ''].filter(Boolean).join(' · ');
      html += '<div class="meta">' + esc(meta) + '</div><div class="videos">';
      p.videos.forEach(function (v, j) {
        html += '<div class="vrow"><div class="name">' + esc(typeName(v.tipo)) + '</div><div class="size">' + esc(size(v.bytes)) + '</div>' +
          '<button class="btn" data-p="' + i + '" data-v="' + j + '">Ver</button>' +
          '<a class="btn lime" href="' + esc(downloadUrl(v)) + '">Descargar</a></div>';
      });
      html += '</div></div></article>';
      p._i = i;
    });
    html += '</div>';
    app.innerHTML = html;
    app.onclick = function (e) {
      var el = e.target.closest('[data-p]');
      if (!el) return;
      var p = list[+el.getAttribute('data-p')];
      var v = p && p.videos[+el.getAttribute('data-v')];
      if (v) openModal(v, p);
    };
  }

  window.openModal = function (v, p) {
    var m = document.getElementById('modal'), pl = document.getElementById('player');
    pl.src = v.url;
    document.getElementById('cap').textContent = (p.equipo_a + ' vs ' + p.equipo_b + ' · ' + typeName(v.tipo));
    m.classList.add('on');
    pl.play().catch(function () {});
  };
  window.closeModal = function () {
    var pl = document.getElementById('player');
    pl.pause(); pl.removeAttribute('src'); pl.load();
    document.getElementById('modal').classList.remove('on');
  };
  document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  document.getElementById('q').addEventListener('input', render);
  load();
})();
</script>
</body>
</html>
